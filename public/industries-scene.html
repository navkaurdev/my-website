/* ============ Industries scene: ambient animation ============ */
.industry-scene { position: relative; overflow: hidden; }
.industry-scene > figure { position: relative; z-index: 2; margin: 0; }

/* soft sky wash sitting behind the (transparent-sky) illustration */
.sky-fx {
  position: absolute; inset: 0; z-index: 1;
  pointer-events: none; overflow: hidden;
  background: linear-gradient(180deg,
    #e9f3ff 0%,
    rgba(233,243,255,0.45) 34%,
    rgba(233,243,255,0) 58%);
}

/* --- drifting clouds --- */
.sky-fx .cloud {
  position: absolute; left: -25%;
  background: #ffffff; border-radius: 100px;
  box-shadow: 0 10px 22px rgba(120,150,190,0.16);
  will-change: transform;
}
.sky-fx .cloud::before,
.sky-fx .cloud::after {
  content: ""; position: absolute; background: inherit; border-radius: 50%;
}
.sky-fx .cloud::before { width: 52%; height: 170%; left: 13%; top: -78%; }
.sky-fx .cloud::after  { width: 38%; height: 135%; right: 15%; top: -48%; }
.sky-fx .c1 { width: 128px; height: 34px; top: 10%; opacity: .90; animation: cloud-drift 52s linear infinite; }
.sky-fx .c2 { width: 84px;  height: 24px; top: 24%; opacity: .70; animation: cloud-drift 70s linear infinite; animation-delay: -20s; }
.sky-fx .c3 { width: 168px; height: 44px; top: 4%;  opacity: .82; animation: cloud-drift 88s linear infinite; animation-delay: -46s; }
.sky-fx .c4 { width: 96px;  height: 27px; top: 36%; opacity: .55; animation: cloud-drift 60s linear infinite; animation-delay: -34s; }
.sky-fx .c5 { width: 66px;  height: 19px; top: 17%; opacity: .60; animation: cloud-drift 78s linear infinite; animation-delay: -61s; }

@keyframes cloud-drift {
  from { transform: translateX(0); }
  to   { transform: translateX(155vw); }
}

/* --- occasional plane crossing high up --- */
.sky-fx .plane {
  position: absolute; top: 13%; left: -14%;
  width: 44px; height: 16px; opacity: 0;
  background: no-repeat center/contain
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 24'%3E%3Cpath fill='%23194a89' d='M2 13l60-7-16 9 4 8-8-2-6 6-2-9z'/%3E%3C/svg%3E");

  8%   { opacity: .5; }
  50%  { transform: translateX(60vw)   translateY(-10px); opacity: .5; }
  92%  { opacity: .5; }
  100% { transform: translateX(130vw)  translateY(-22px); opacity: 0; }
}
